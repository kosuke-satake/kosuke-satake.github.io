<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kosuke Satake - GitHub Dashboard</title>
  <meta name="description" content="What Kosuke Satake has built on GitHub: apps, robotics and web projects, with status, releases and activity. Search and filter by area, status, language and tag.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%230d1117'/%3E%3Crect%20x='5'%20y='5'%20width='6'%20height='6'%20rx='1'%20fill='%230e4429'/%3E%3Crect%20x='13'%20y='5'%20width='6'%20height='6'%20rx='1'%20fill='%23006d32'/%3E%3Crect%20x='21'%20y='5'%20width='6'%20height='6'%20rx='1'%20fill='%2326a641'/%3E%3Crect%20x='5'%20y='13'%20width='6'%20height='6'%20rx='1'%20fill='%23006d32'/%3E%3Crect%20x='13'%20y='13'%20width='6'%20height='6'%20rx='1'%20fill='%2339d353'/%3E%3Crect%20x='21'%20y='13'%20width='6'%20height='6'%20rx='1'%20fill='%23006d32'/%3E%3Crect%20x='5'%20y='21'%20width='6'%20height='6'%20rx='1'%20fill='%2326a641'/%3E%3Crect%20x='13'%20y='21'%20width='6'%20height='6'%20rx='1'%20fill='%230e4429'/%3E%3Crect%20x='21'%20y='21'%20width='6'%20height='6'%20rx='1'%20fill='%2339d353'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#work">Skip to the projects</a>
  <header id="hero" class="hero"><p class="loading" role="status">Loading…</p></header>
  <main>
    <noscript><p class="notice">This dashboard needs JavaScript to show the GitHub data.</p></noscript>
    <p id="load-error" class="notice" role="alert" hidden>The dashboard data could not be loaded. Please try again later.</p>

    <section id="featured" class="section" aria-labelledby="featured-title" hidden>
      <h2 id="featured-title">Featured</h2>
      <ul class="featured-grid projects" tabindex="0" aria-label="Featured projects"></ul>
    </section>

    <section id="recent" class="section" aria-labelledby="recent-title" hidden>
      <h2 id="recent-title">Recent work</h2>
      <ul class="recent-list"></ul>
    </section>

    <section id="work" class="section" aria-labelledby="work-title" tabindex="-1" hidden>
      <h2 id="work-title">All work</h2>
    </section>

    <section id="activity" class="section" aria-labelledby="activity-title" hidden></section>
  </main>
  <footer id="footer" class="footer"></footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
